name: Deploy (Prod)

on:
  push:
    tags:
      - v*.*.*.*

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build:
    name: Build
    needs: [gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Log Node & OS versions
        run: |
          node -v
          cat /etc/os-release

      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup Node 22.x
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Log Node & OS versions
        run: |
          node -v
          cat /etc/os-release

      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.OPENLYTIC_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.OPENLYTIC_AWS_SECRET_KEY }}
          aws-region: ${{ secrets.OPENLYTIC_AWS_REGION }}

      - name: Trigger Amplify Deployment
        run: |
          aws amplify start-job \
            --app-id ${{ secrets.OPENLYTIC_AMPLIFY_APP_ID }} \
            --branch-name release \
            --commit-id "${{ github.sha }}" \
            --commit-message "${{ github.ref_name }} : ${{ github.event.head_commit.message }}" \
            --job-type RELEASE

  notification:
    if: ${{ failure() }}
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify dedicated teams channel
        uses: jdcargile/ms-teams-notification@v1.3
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.OPENLYTIC_MSTEAMS_WEBHOOK }}
          notification-summary: Prod organization app deployment failed for tag ${{ github.ref_name }}!
          notification-color: dc3545
          timezone: Asia/Dhaka